
<!-- app/templates/change_password.html -->

{% extends "base_public.html" %}

{% block content %}

<h3 class="mb-2">Change Password</h3>

<p class="text-muted">
    Create a new password to continue.
</p>

{% if error %}

<div class="alert alert-danger">
    {{ error }}
</div>

{% endif %}

<form method="POST" action="/change-password">

    <div class="mb-3">

        <label class="form-label">
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            class="form-control"
            minlength="8"
            maxlength="72"
            required
        >

    </div>

    <div class="mb-4">

        <label class="form-label">
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            class="form-control"
            minlength="8"
            maxlength="72"
            required
        >

    </div>

    <button
        type="submit"
        class="btn btn-primary w-100"
    >
        Update Password
    </button>

</form>

{% endblock %}
