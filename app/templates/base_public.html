
<!-- app/templates/base_public.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ title | default("Welcome") }} - {{ app_name | default("GIST SMS") }}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', path='/css/app.css') }}"
          rel="stylesheet">

</head>

<body class="public-body {% block body_class %}{% endblock %}">

    <div class="public-container {% block container_class %}{% endblock %}">

        <div class="public-brand">
            <h3>GIST SMS</h3>
            <p>GIST Student Management System</p>
        </div>

        <div class="{% block card_class %}public-card{% endblock %}">

            {% block content %}
            {% endblock %}

        </div>

        <div class="public-footer">
            <small>
                GIST
            </small>
        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

</body>
</html>
